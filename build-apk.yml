name: Build Chess APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip build-essential libffi-dev libssl-dev

      - name: Install python packages
        run: |
          pip install buildozer cython

      - name: Generate buildozer config
        run: |
          buildozer init
          sed -i 's/title = My Application/title = 中国象棋/g' buildozer.spec
          sed -i 's/package.name = myapp/package.name = chess/g' buildozer.spec
          sed -i 's/package.domain = org.test/package.domain = org.chess/g' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,pygame-ce/g' buildozer.spec
          sed -i 's/fullscreen = 1/fullscreen = 0/g' buildozer.spec
          sed -i 's/orientation = landscape/orientation = portrait/g' buildozer.spec
          sed -i 's/android.api = 33/android.api = 34/g' buildozer.spec
          sed -i 's/android.ndk = 25b/android.ndk = 26b/g' buildozer.spec
          # 后面我们加上字体的时候，再解开下面这一行注释
          # sed -i 's/#add_assets =/add_assets = simhei.ttf/g' buildozer.spec

      - name: Build APK
        run: |
          buildozer android debug

      - name: Download APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 中国象棋APK
          path: bin/*.apk