name: Build Chess APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-11-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtiff5-dev libjpeg-dev libpng-dev libgif-dev libssl-dev libsqlite3-dev

      - name: Install python packages
        run: |
          pip install buildozer cython

      - name: Pre accept android sdk licenses
        run: |
          mkdir -p ~/.android
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.android/repositories.cfg

      - name: Generate buildozer.spec
        run: |
          buildozer init
          sed -i 's/title = My Application/title = 中国象棋/g' buildozer.spec
          sed -i 's/package.name = myapp/package.name = chess/g' buildozer.spec
          sed -i 's/package.domain = org.myapp/package.domain = org.chess.game/g' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,pygame-ce/g' buildozer.spec
          sed -i 's/fullscreen = 1/fullscreen = 0/g' buildozer.spec
          sed -i 's/#android.sdk_path =/android.sdk_path =/g' buildozer.spec
          sed -i 's/#android.build_tools_version =/android.build_tools_version = 34.0.0/g' buildozer.spec

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 中国象棋APK
          path: bin/*.apk
